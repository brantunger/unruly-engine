rootProject.name = 'unruly-engine'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

// core: the unruly-engine-core artifact, the engine without a language.
// mvel: the unruly-engine artifact, the MVEL language. It depends on core, and holds the tests that need MVEL.
// test-kit: the unruly-engine-test artifact, tools for testing an expression language. It depends on core, so the
//   tests that use it are in mvel, not in core.
// benchmarks: JMH benchmarks of the engine. Not published, and not part of `check`.
// native-smoke: an application CI builds into a GraalVM native image and runs (docs/native-image.md). Not published.
include 'core', 'mvel', 'test-kit', 'benchmarks', 'native-smoke'
