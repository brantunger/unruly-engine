rootProject.name = 'unruly-engine'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

// core: the unruly-engine-core artifact, the engine without a language.
// mvel: the unruly-engine artifact, the MVEL language. It depends on core, and holds the tests.
// test-kit: the unruly-engine-test artifact, tools for testing an expression language. The tests in mvel use it.
// benchmarks: JMH benchmarks of the engine. Not published, and not part of `check`.
include 'core', 'mvel', 'test-kit', 'benchmarks'
