# A class-level @Timeout in JUnit's default SAME_THREAD mode is reported once the test method returns, so it catches
# a test that is merely slow and is powerless against one that never returns at all. SEPARATE_THREAD runs the test
# body on a thread JUnit owns and interrupts it at the deadline, so a hung test becomes a failing test with a stack
# trace instead of a build that has to be killed by hand.
#
# It moves the body off the thread @BeforeEach and @AfterEach run on, so a test class that carries state from its
# body to one of those in a thread-local keeps the default with an explicit threadMode on its own @Timeout; see
# RuleSetTest.
#
# One caveat, on a build that is already failing: JUnit interrupts the body's thread at the deadline and never
# joins it, so a body abandoned inside TestLogs.logsOf still holds the System.err it swapped in, and its finally
# can put the original back over a later test's buffer. That later test then captures nothing and fails on an
# empty log, naming itself rather than the test that hung: read the first failure.
junit.jupiter.execution.timeout.thread.mode.default = separate_thread
