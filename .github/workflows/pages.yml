name: Pages

# Deploys the gh-pages branch, which keeps every release's Javadoc, to GitHub Pages. The release workflow calls this
# after each publish; run it by hand (`gh workflow run pages.yml --ref main`) to redeploy the branch as it is.
#
# The site's Pages source is GitHub Actions, so pushing to gh-pages deploys nothing on its own: only a deployment made
# by a workflow, like this one, updates the site. Settings -> Pages -> Source must stay "GitHub Actions".

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two deployments at once could finish out of order and leave the older tree live.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false

      # Leaves out .git, .github and other hidden files; the site has none it needs.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
