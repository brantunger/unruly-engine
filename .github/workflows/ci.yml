name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The toolchain pins compilation to 17; 21 is here to catch runtime surprises.
        java-version: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      # `build` runs `check`, which pulls in Checkstyle, PMD and the 100% Jacoco gate.
      - name: Build & Test
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report-jdk${{ matrix.java-version }}
          path: build/reports/jacoco/

      - name: Upload Coverage to Codecov
        if: matrix.java-version == '17'
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/jacoco/report.xml
          fail_ci_if_error: false

  # Submits the resolved dependency graph so Dependabot alerts cover transitives,
  # not just the coordinates declared in build.gradle.
  dependency-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Runs the injected :ForceDependencyResolutionPlugin_resolveAllDependencies task,
      # which resolves every configuration without the cost of a full build.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6
