name: CI

on:
  # `1.x` is the hotfix branch for the 1.x line; see RELEASING.md.
  pull_request:
    branches: [ "main", "1.x" ]
  push:
    branches: [ "main", "1.x" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # id-token lets the Codecov step authenticate with OIDC instead of a stored token.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The full gate runs on JDK 21 on each OS: the module-path applications and the child JVMs the tests launch
        # depend on the OS, and Windows's and macOS's file systems are case-insensitive (the case-insensitive class
        # lookup itself is still faked in the tests; see #414). Compilation stays on the Java 21 toolchain; -PtestJdk
        # runs the tests on JDK 25, on Linux only.
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java-version: [ '21' ]
        include:
          - os: ubuntu-latest
            java-version: '25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compilation always uses the Java 21 toolchain, and Gradle doesn't download one (gradle.properties turns
      # auto-download off), so the JDK 25 leg installs 21 as well. setup-java lists each JDK it installs in
      # ~/.m2/toolchains.xml, which Gradle reads. Installed first, so the leg's own JDK stays JAVA_HOME.
      - name: Set up the Java 21 toolchain
        if: matrix.java-version != '21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # Validates the Gradle wrapper, and caches Gradle's dependencies, wrapper and build cache between runs. Runs on
      # main save the cache; pull requests only read it, and each OS has its own. The basic provider is open source;
      # the default, enhanced one isn't. The configuration cache isn't saved, because that needs an encryption key.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # `build` runs `check`: Checkstyle, PMD, the 100% JaCoCo gate, the API compatibility check of every artifact,
      # the Javadoc site and each project's Javadoc, so a broken doc comment fails here, and the tests, including the
      # applications ModulePathTest runs on the module path. On Windows the default shell, pwsh, resolves ./gradlew
      # to gradlew.bat.
      - name: Build & Test
        if: matrix.java-version == '21'
        run: ./gradlew build jacocoTestReport

      # Compilation always uses the Java 21 toolchain, so only the tests depend on this JDK; -PtestJdk runs them on it.
      - name: Test on JDK ${{ matrix.java-version }}
        if: matrix.java-version != '21'
        run: ./gradlew :mvel:test -PtestJdk=${{ matrix.java-version }}

      # Artifact names must be unique within a run, and three jobs run on JDK 21, so the OS is part of each name.
      - name: Upload API Compatibility Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: api-compatibility-report-jdk${{ matrix.java-version }}-${{ matrix.os }}
          path: |
            core/build/reports/japicmp/
            mvel/build/reports/japicmp/
            test-kit/build/reports/japicmp/
          if-no-files-found: ignore

      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.java-version == '21'
        with:
          name: jacoco-report-jdk${{ matrix.java-version }}-${{ matrix.os }}
          path: build/reports/jacoco/

      # Codecov gets one report per run, from Linux, and a failed upload fails the job. The upload authenticates
      # with the job's OIDC token, which GitHub doesn't issue to a pull request from a fork or to any run Dependabot
      # triggers (a pull request, or a push when it merges one), so those runs skip the upload rather than fail.
      - name: Upload Coverage to Codecov
        if: >-
          matrix.java-version == '21' && matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: build/reports/jacoco/report.xml
          use_oidc: true
          fail_ci_if_error: true

  # Submits the resolved dependency graph so Dependabot alerts cover transitives,
  # not just the coordinates declared in build.gradle.
  dependency-graph:
    # Dependabot alerts use the default branch's graph, so a push to 1.x has nothing to submit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Runs the injected :ForceDependencyResolutionPlugin_resolveAllDependencies task,
      # which resolves every configuration without the cost of a full build.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
