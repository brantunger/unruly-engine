name: CI

on:
  # `1.x` is the hotfix branch for the 1.x line; see RELEASING.md.
  pull_request:
    branches: [ "main", "1.x" ]
  push:
    branches: [ "main", "1.x" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Compilation stays on the Java 17 toolchain; -PtestJdk runs the tests on each JDK listed here.
        java-version: [ '17', '21' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      # `build` runs `check`, which pulls in Checkstyle, PMD, the 100% Jacoco gate and the API compatibility check.
      - name: Build & Test
        run: ./gradlew build jacocoTestReport --no-daemon -PtestJdk=${{ matrix.java-version }}

      - name: Upload API Compatibility Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: api-compatibility-report-jdk${{ matrix.java-version }}
          path: build/reports/japicmp/
          if-no-files-found: ignore

      # `build` doesn't run javadoc; otherwise the release's publish job, after tagging, is the first
      # place a broken Javadoc comment fails. Javadoc doesn't depend on the test JDK, so one run is enough.
      - name: Javadoc
        if: matrix.java-version == '17'
        run: ./gradlew javadoc --no-daemon

      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jacoco-report-jdk${{ matrix.java-version }}
          path: build/reports/jacoco/

      - name: Upload Coverage to Codecov
        if: matrix.java-version == '17'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: build/reports/jacoco/report.xml
          fail_ci_if_error: false

  # Submits the resolved dependency graph so Dependabot alerts cover transitives,
  # not just the coordinates declared in build.gradle.
  dependency-graph:
    # Dependabot alerts use the default branch's graph, so a push to 1.x has nothing to submit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      # Runs the injected :ForceDependencyResolutionPlugin_resolveAllDependencies task,
      # which resolves every configuration without the cost of a full build.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
