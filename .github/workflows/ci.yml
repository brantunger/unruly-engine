name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A run on main is never cancelled once it has started:
# the next push to main waits for it, so a run that starts gets to its cache save. It isn't a queue, though. GitHub
# keeps only one waiting run per concurrency group, so a push to main that lands while an earlier one is still
# waiting replaces it, and the replaced commit gets a cancelled run and no build of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Sorts a pull request into a scope: docs (documentation only), release (only what a release-please pull request
  # changes) or code. The build and native-image jobs skip a docs pull request; a release pull request runs one build
  # leg, ubuntu-latest on JDK 21 with the coverage gate, and skips native-image; docs-and-hygiene checks every pull
  # request. A push's run always runs everything, so main keeps its caches and its JDK 21 legs run the coverage gate.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      # A pull request's run checks out the merge of the pull request into its base branch, whose first parent is
      # the base branch, so HEAD^1..HEAD is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # docs: every changed path is under docs/ or ends in .md, and none is under a src/ directory.
      # release: gradle.properties at the root adds a version= line, the one release-please bumps, and changes no other
      # line; every other changed path is documentation, as above, or .release-please-manifest.json. gradle.properties
      # also holds build settings, such as org.gradle.warning.mode, so any other changed line makes the pull request
      # code, and so does a manifest change without a new version= line, or a mode change alone.
      # code: anything else, or an empty diff. So is a path release-please starts to change in future: the safe default.
      # --no-renames lists a moved file's old path too, so moving a file into docs/ still counts as code.
      - name: Find what the pull request changes
        id: diff
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          scope=code
          if [ -n "$changed" ] && ! grep -qE '(^|/)src/' <<< "$changed"; then
            if ! grep -qvE '^docs/|\.md$' <<< "$changed"; then
              scope=docs
            elif ! grep -qvE '^docs/|\.md$|^\.release-please-manifest\.json$|^gradle\.properties$' <<< "$changed"; then
              # With -U0, every line after the first @@ is a changed line (the file headers come before it): at least
              # one must add a version= line, and each must be a version= line. No pipe, so a git diff that fails
              # stops the step, and no scope is output.
              props=$(git diff -U0 --no-renames HEAD^1 HEAD -- gradle.properties)
              if awk '/^@@/ { hunk = 1; next } hunk && /^\+version=/ { added = 1; next }
                hunk && !/^-version=/ { other = 1 } END { exit !(added && !other) }' <<< "$props"; then
                scope=release
              fi
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  build:
    # Skips only when the changes job said the pull request is documentation only: on a push the changes job is
    # skipped, and when it fails, its output is empty, so the build runs.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'docs' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The full gate runs on JDK 21 on each OS: the module-path applications and the child JVMs the tests launch
      # depend on the OS, and Windows's and macOS's file systems are case-insensitive, so the tests that look a
      # compiled class up in another case for real run there, and skip on ubuntu-latest, where fakes cover them.
      # Compilation stays on the Java 21 toolchain; -PtestJdk runs the tests on JDK 25 and 26, on Linux only.
      #
      # A release pull request runs only the ubuntu-latest JDK 21 leg: it changes a version and the changelog, and the
      # merge's push runs every leg. A job-level if: can't read matrix, so the matrix itself is picked here, from two
      # literals, before any leg exists. Any scope but release, an empty one included (a push, or a changes job that
      # failed or was cancelled), gets the full matrix. The lines below share one indent, so YAML folds them into one
      # line, and the expression and its JSON hold no line break.
      matrix: >-
        ${{ fromJSON(needs.changes.outputs.scope == 'release'
        && '{"os": ["ubuntu-latest"], "java-version": ["21"]}'
        || '{"os": ["ubuntu-latest", "windows-latest", "macos-latest"], "java-version": ["21"],
        "include": [{"os": "ubuntu-latest", "java-version": "25"}, {"os": "ubuntu-latest", "java-version": "26"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compilation always uses the Java 21 toolchain, and Gradle doesn't download one (gradle.properties turns
      # auto-download off), so the JDK 25 and 26 legs install 21 as well. setup-java lists each JDK it installs in
      # ~/.m2/toolchains.xml, which Gradle reads. Installed first, so the leg's own JDK stays JAVA_HOME.
      - name: Set up the Java 21 toolchain
        if: matrix.java-version != '21'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # Validates the Gradle wrapper, and caches Gradle's dependencies, wrapper and build cache between runs. Runs on
      # main save the cache; pull requests only read it, and each OS has its own. The basic provider is open source;
      # the default, enhanced one isn't. The configuration cache isn't saved, because that needs an encryption key.
      #
      # On the ubuntu-latest JDK 21 leg it also injects the dependency-graph plugin into the build, as the
      # dependency-graph job below does on main, but only generates the graph: nothing is submitted or uploaded, so
      # the job needs no more than read access. That job can't check the plugin, because dependency-submission runs
      # Gradle with -Dorg.gradle.dependency.verification=off. Here the build resolves it with verification on, against
      # the checksum pinned for it in gradle/verification-metadata.xml, so a gradle/actions bump that moves to a new
      # plugin version fails the pull request until the pin is updated (docs/contributing/dependency-verification.md),
      # not main after the merge. A plugin that doesn't verify fails the build whatever continue-on-failure says; false
      # makes the init script fail on a Gradle version the plugin doesn't support, rather than warn and skip it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          dependency-graph: >-
            ${{ matrix.os == 'ubuntu-latest' && matrix.java-version == '21' && 'generate' || 'disabled' }}
          dependency-graph-continue-on-failure: false

      # `build` runs `check`: Checkstyle, PMD, the 100% JaCoCo gate, the API compatibility check of every artifact,
      # the Javadoc site and each project's Javadoc, so a broken doc comment fails here, and the tests, including the
      # applications ModulePathTest runs on the module path. On Windows the default shell, pwsh, resolves ./gradlew
      # to gradlew.bat.
      #
      # -PapiCheck.refresh looks the API baseline, the newest release, up again. Without it, the version lookup in the
      # Gradle cache that setup-gradle restores can be up to a day old, so a leg could compare with an older release.
      # Local builds keep the lookup for 24 hours so the configuration cache can be reused; CI doesn't save that cache,
      # so it loses nothing. The steps on JDK 25 and 26 and the native-image job don't run the check, so they don't need
      # the refresh.
      - name: Build & Test
        if: matrix.java-version == '21'
        run: ./gradlew build jacocoTestReport "-PapiCheck.refresh"

      # Compilation always uses the Java 21 toolchain, so only the tests depend on this JDK; -PtestJdk runs them on it.
      # All three test tasks: core has its own tests, mvel the ones that need MVEL, the kit's MVEL tests among them,
      # and test-kit the kit's other tests.
      - name: Test on JDK ${{ matrix.java-version }}
        if: matrix.java-version != '21'
        run: ./gradlew :core:test :mvel:test :test-kit:test -PtestJdk=${{ matrix.java-version }}

      # Artifact names must be unique within a run, and three jobs run on JDK 21, so the OS is part of each name.
      - name: Upload API Compatibility Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: api-compatibility-report-jdk${{ matrix.java-version }}-${{ matrix.os }}
          path: |
            core/build/reports/japicmp/
            mvel/build/reports/japicmp/
            test-kit/build/reports/japicmp/
          if-no-files-found: ignore

      # Gradle's report names why each file failed verification, such as a missing signature or a wrong checksum. It
      # lands in the root build directory even when buildSrc's dependencies fail, and goes with the runner otherwise.
      - name: Upload Dependency Verification Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: dependency-verification-report-jdk${{ matrix.java-version }}-${{ matrix.os }}
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

      # The test results go up with the coverage, because coverage alone can't tell a test that ran from one that
      # was skipped: the JUnit XML names the skipped tests and says why, which is how a leg proves it ran the
      # lookups that only a case-insensitive file system has.
      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.java-version == '21'
        with:
          name: jacoco-report-jdk${{ matrix.java-version }}-${{ matrix.os }}
          # A test JVM that crashes writes hs_err_pid*.log to its module's directory, where Gradle runs it.
          path: |
            build/reports/jacoco/
            core/build/test-results/test/
            mvel/build/test-results/test/
            test-kit/build/test-results/test/
            core/hs_err_pid*.log
            mvel/hs_err_pid*.log
            test-kit/hs_err_pid*.log
            **/replay_pid*.log

      # The JDK 25 and 26 legs run only the tests, so they have no coverage, but their test results show what ran and
      # what failed.
      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.java-version != '21'
        with:
          name: test-results-jdk${{ matrix.java-version }}-${{ matrix.os }}
          # A test JVM that crashes writes hs_err_pid*.log to its module's directory, where Gradle runs it.
          path: |
            core/build/test-results/test/
            mvel/build/test-results/test/
            test-kit/build/test-results/test/
            core/hs_err_pid*.log
            mvel/hs_err_pid*.log
            test-kit/hs_err_pid*.log
            **/replay_pid*.log

  # Builds the native-smoke application into a GraalVM native image and runs it (docs/native-image.md), with only the
  # reflection metadata the mvel jar ships and the application's own, and without Flight Recorder support, which is
  # native-image's default. The engine makes MVEL's reflective optimizer the default, so MVEL generates no classes at
  # run time, which a native image can't do.
  # Then builds and runs it again with strict reachability metadata, which GraalVM says will become the default.
  # Skipped on a docs or release pull request; an empty scope (a push, or a failed changes job) runs it.
  native-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scope != 'docs' && needs.changes.outputs.scope != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GraalVM Community Edition 21.0.2, the release docs/native-image.md was tested with, as JAVA_HOME; Gradle's
      # Java 21 toolchain finds it too.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '21.0.2'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build the application
        run: ./gradlew :native-smoke:installDist

      # See the same step in the build job.
      - name: Upload Dependency Verification Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: dependency-verification-report-native-image
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

      - name: Build the native image
        run: |
          mkdir -p native-smoke/build/native
          native-image --no-fallback -H:+ReportExceptionStackTraces \
            -cp 'native-smoke/build/install/native-smoke/lib/*' -o native-smoke/build/native/native-smoke com.example.nativesmoke.Main

      # The application checks its own results and exits with 1 if one is wrong.
      - name: Run it
        run: native-smoke/build/native/native-smoke

      # In this mode a lookup the image has no metadata for throws MissingReflectionRegistrationError, where the default
      # mode throws ClassNotFoundException, so library code that looks a name up and handles only the latter fails the
      # run below. Only the library's packages are listed: MVEL looks up with Class.forName names that a rule's text
      # makes up, which can't have metadata, so the mode for all code fails every rule that reads a property. GraalVM
      # for JDK 21 matches each package exactly, not as a prefix, so the packages= lines must name every package of the
      # library's classes in the image; native-smoke's checkStrictImagePackages task, part of ./gradlew build, fails
      # when they don't, or name one that isn't there. A lookup through a ClassLoader throws regardless of the list.
      # GraalVM for JDK 23 and later name the option --exact-reachability-metadata.
      - name: Build the native image with strict metadata
        run: |
          packages=io.github.brantunger.unruly.api,io.github.brantunger.unruly.api.exception
          packages=$packages,io.github.brantunger.unruly.api.language,io.github.brantunger.unruly.core
          packages=$packages,io.github.brantunger.unruly.mvel,io.github.brantunger.unruly.mvel.warmup
          native-image --no-fallback -H:+ReportExceptionStackTraces \
            -H:+UnlockExperimentalVMOptions "-H:ThrowMissingRegistrationErrors=$packages" \
            -cp 'native-smoke/build/install/native-smoke/lib/*' -o native-smoke/build/native/native-smoke-strict \
            com.example.nativesmoke.Main

      - name: Run it with strict metadata
        run: native-smoke/build/native/native-smoke-strict

  # Checks documentation, workflows and repository hygiene with Python, git and a downloaded actionlint, without
  # Gradle. A failed step fails the job, and so ci-result, except the style check, which only warns
  # (continue-on-error). Each check runs even when an earlier one failed (!cancelled()), so a run reports them all.
  # See docs/contributing/build-and-gates.md for running them locally.
  docs-and-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Links, anchors and table rows
        run: python3 docs/scripts/check_docs.py

      # Every text file is stored with LF (.gitattributes); a file committed with CRLF, or with both, shows here.
      - name: Line endings
        if: ${{ !cancelled() }}
        run: |
          bad=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed"')
          if [ -n "$bad" ]; then
            echo "::error::These files are stored with CRLF line endings; run 'git add --renormalize .' and commit:"
            echo "$bad"
            exit 1
          fi

      # actionlint checks the workflows, and the shell in their run blocks with the runner's shellcheck. The tarball
      # isn't an action, so Dependabot doesn't bump it: to update, change the version and take the sha256 from the
      # linux_amd64 line of the release's actionlint_<version>_checksums.txt.
      - name: Workflows
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          shellcheck --version   # without shellcheck, actionlint silently drops its shellcheck rule
          "$RUNNER_TEMP/actionlint" -color

      # Only the pages a pull request changes, and it only warns: pages written before docs/contributing/style.md
      # still have findings. CHANGELOG.md is written by release-please.
      - name: Style of the changed pages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          pages=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.md' ':!CHANGELOG.md')
          if [ -n "$pages" ]; then
            mapfile -t files <<< "$pages"
            python3 docs/scripts/check_style.py "${files[@]}"
          fi

      # The pages in config/docs-checks/ hold the cases the two docs checks above once got wrong; check_fixtures.py
      # runs both scripts on them and compares every line they print with the verdict it records for each page.
      - name: The docs checks on their fixtures
        if: ${{ !cancelled() }}
        run: python3 docs/scripts/check_fixtures.py

  # One result for the jobs above, for branch protection to require: a docs or release pull request skips build legs,
  # and a leg that doesn't run reports no per-OS check. The build passes when it succeeded (on a release pull request,
  # its one leg), or was skipped on a docs pull request; native-image when it succeeded, or was skipped on a docs or
  # release pull request; docs-and-hygiene only when it succeeded. Any other result fails, such as that of a job
  # cancelled before a runner took it. The changes job isn't judged: when it fails, its scope is empty, so the build
  # and native-image run in full, and they decide.
  ci-result:
    if: ${{ !cancelled() }}
    needs: [ changes, build, native-image, docs-and-hygiene ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          BUILD: ${{ needs.build.result }}
          NATIVE_IMAGE: ${{ needs.native-image.result }}
          DOCS_AND_HYGIENE: ${{ needs.docs-and-hygiene.result }}
        run: |
          echo "changes: '$CHANGES' (scope: '$SCOPE'), build: '$BUILD', native-image: '$NATIVE_IMAGE'," \
            "docs-and-hygiene: '$DOCS_AND_HYGIENE'"
          # passed RESULT SCOPE...: the job succeeded, or was skipped on a pull request of one of the scopes named.
          passed() {
            local result=$1 scope
            shift
            [ "$result" = success ] && return 0
            [ "$result" = skipped ] || return 1
            for scope in "$@"; do [ "$SCOPE" = "$scope" ] && return 0; done
            return 1
          }
          failed=""
          passed "$BUILD" docs || failed="$failed build"
          passed "$NATIVE_IMAGE" docs release || failed="$failed native-image"
          [ "$DOCS_AND_HYGIENE" = success ] || failed="$failed docs-and-hygiene"
          if [ -n "$failed" ]; then
            echo "::error::Didn't pass:$failed. The build passes when it succeeded, or was skipped on a docs pull" \
              "request; native-image when it succeeded, or was skipped on a docs or release pull request;" \
              "docs-and-hygiene only when it succeeded."
            exit 1
          fi

  # Submits the resolved dependency graph so Dependabot alerts cover transitives,
  # not just the coordinates declared in build.gradle.kts.
  dependency-graph:
    # Dependabot alerts use the default branch's graph, so only a push to `main` has anything to submit. The trigger
    # above already limits pushes to `main`, so the ref test can't fail today; it's kept so that adding a branch
    # there can't start overwriting the default branch's graph. (In release.yml the same test is live, because
    # workflow_dispatch can be launched from any ref.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Runs the injected :ForceDependencyResolutionPlugin_resolveAllDependencies task,
      # which resolves every configuration without the cost of a full build.
      # The action runs Gradle with -Dorg.gradle.dependency.verification=off, so nothing this job downloads, the
      # plugin it injects included, is checked against gradle/verification-metadata.xml. The build job's
      # ubuntu-latest JDK 21 leg resolves the same plugin with verification on.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
