name: PR Title

# PRs are squash-merged with the PR title as the commit subject, and that subject is
# the only thing release-please reads to decide the next version. A malformed title
# silently produces no release, so it is checked like any other build gate.

on:
  pull_request_target:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only `feat`, `fix` and a `!` breaking marker bump the version and appear in the
          # changelog. Every other type is hidden in release-please-config.json and never
          # cuts a release on its own.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            deps
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" is invalid for the "{type}" type.
            It should start with a lowercase letter and not end with a period.

      # release-please reads `!` after any type as a breaking change, cuts a major release and
      # lists the commit under "BREAKING CHANGES", even for a type the changelog hides, such as
      # deps. Only feat and fix may carry it. The title is passed through the environment, not
      # interpolated into the script, because this runs on pull_request_target.
      - name: Allow a breaking-change marker only on feat and fix
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^([a-z]+)(\([^\)]*\))?!: ]]; then
            type="${BASH_REMATCH[1]}"
            if [[ "$type" != "feat" && "$type" != "fix" ]]; then
              echo "::error::'$type!' would cut a major release. Use feat! or fix! for a breaking change, or remove the !."
              exit 1
            fi
          fi
