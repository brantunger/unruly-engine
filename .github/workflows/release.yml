name: Release

# Two jobs, one workflow, on purpose. A tag or Release created with GITHUB_TOKEN does
# not trigger `on: push: tags` or `on: release` workflows — GitHub suppresses that to
# prevent recursion. Chaining the publish to release-please via `needs` avoids needing
# a PAT just to get the publish to fire.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  # A running release is never cancelled: interrupting an upload leaves a half-finished deployment on the Portal.
  # A waiting one can be, though. GitHub keeps only one waiting run per concurrency group, so a push that lands
  # while an earlier push's run is still waiting replaces that run. That costs nothing: release-please looks at
  # main as it is, not at the commit that triggered the run, so the newer run still finds a merged release PR
  # labelled `autorelease: pending` and releases it, and still brings the open release PR up to date.
  cancel-in-progress: false

jobs:
  release-please:
    # workflow_dispatch can be launched from any branch; without this guard
    # release-please would open a release PR against that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A release PR opened with GITHUB_TOKEN gets a CI run that waits for a maintainer's
          # approval, and no PR title check (pull_request_target) at all. Swap for a fine-grained
          # PAT (contents+PRs write) if the title check becomes required on main.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Always `main`, by the guard above.
          target-branch: ${{ github.ref_name }}

      # The notes release-please writes are the changelog entry and nothing else, so the migration guides are linked
      # here. There's no way to do it from release-please-config.json: the schema has only pull-request-header and
      # pull-request-footer, which release-please strips back out before it takes the notes for the Release, and the
      # action has no notes input. Doing it on the release-please side would be wrong anyway — the Release notes and
      # the CHANGELOG.md entry are the same generated text, so a header there would repeat in every entry of a file
      # that is a permanent record.
      # The links are pinned to the tag, not to `main`: the notes are permanent, and a page that later moves or is
      # renamed would leave a dead link behind in every past release. Nothing checks a link written in a workflow
      # file — scripts/docs/check_docs.py only checks the pages, the Java sources and the Javadoc overview — so each
      # page is looked up at the tag first and one that can't be confirmed is never published as a 404. It's every
      # page or none, because the marker below is the step's only "already done" test: notes written while one page
      # was unconfirmed could never gain its link, whereas notes left untouched can still be repaired by hand. The
      # lookup can also fail for a reason that isn't a missing page, so the warning says what gh reported rather
      # than claiming the page is gone.
      # Like the Latest mark this is cosmetic, so every way of failing to add the links only warns. Only a broken
      # environment still fails the job: an empty tag, which would mean release-please's own output is broken, or a
      # RUNNER_TEMP that can't be written. A failure in this job would skip `publish` and strand a version that was
      # never built or uploaded, and re-running wouldn't repair it: release-please would find the Release already
      # there and report no new release, so `publish` never fires again. That is why the Latest step, whose lookup
      # can fail the job, is the first step of `publish`, where "Re-run failed jobs" recovers it.
      # It runs before the Latest step so that anything `gh release edit` might do to the Latest mark — today it
      # sends only `body` — is repaired by that step in `publish`. Note the watch email and the Atom entry go out
      # when release-please publishes the Release, before this step, and editing the body doesn't re-send them.
      # The heading and both links suit any 2.x release; revisit them at 3.0.
      - name: Link the migration guides from the release notes
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          : "${TAG:?release-please reported no tag}"
          # An invisible marker, so a second run of this step appends nothing.
          marker='<!-- migration-guides -->'
          if ! body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body'); then
            echo "::warning::Couldn't read the ${TAG} release notes, so they don't link the migration guides. See RELEASING.md."
            exit 0
          fi
          case "$body" in
            *"$marker"*)
              echo "::notice::The ${TAG} release notes already link the migration guides."
              exit 0
              ;;
          esac
          links=''
          missing=''
          absent=0
          wanted=0
          while read -r path title; do
            wanted=$((wanted + 1))
            # gh's own message is kept and reported, because it says 404 for a page that isn't at the tag and
            # something else — 401, 403, a rate limit, a 5xx — for a lookup that never got an answer. --silent
            # drops the body; the message is collapsed onto one line so it fits in the warning.
            if reason=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TAG}" --silent 2>&1); then
              links="${links}- [${title}](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/${path})"$'\n'
            else
              absent=$((absent + 1))
              missing="${missing:+${missing}, }${path}"
              echo "::warning::Couldn't confirm ${path} is in ${TAG}, so the release notes don't link it: ${reason//$'\n'/ }. See RELEASING.md."
            fi
          done <<'EOF'
          docs/migrating-to-2.md Migrating to 2.0
          docs/migrating-to-2-implementers.md Migrating a language or an engine
          EOF
          # Every guide or none: a marker written beside one link would lock the other out for ever.
          if [ "$absent" -gt 0 ]; then
            echo "::warning::Couldn't confirm ${absent} of ${wanted} migration guides in ${TAG} (${missing}), so the release notes link none of them. See RELEASING.md."
            exit 0
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            printf '%s\n\n' "$body"
            printf '%s\n\n' "$marker"
            printf '### 🔼 Upgrading from 1.x\n\n'
            printf '%s' "$links"
          } > "$notes"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" \
            || echo "::warning::Couldn't add the migration guides to the ${TAG} release notes. See RELEASING.md."

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Generous: the build and the synchronous Portal validation both run inside this job,
    # and a job timeout is a hard failure, so it must sit well clear of the sum of the steps.
    timeout-minutes: 45
    environment: maven-central
    # contents: write attaches the jars and SBOMs to the GitHub Release and pushes the Javadoc to gh-pages.
    # id-token and attestations are for the attest step below: it signs the provenance with the job's short-lived
    # OIDC token and records the attestation on the repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Publish exactly the commit that was tagged, never a moving main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # release-please marks every GitHub Release it creates as the repository's "Latest" release, even when a newer
      # version is already out, so this puts the mark back on the highest released version, which already includes the
      # release just created. Releases all come from `main`, so the mark normally belongs to the release just made; the
      # check is one successful listing of the Releases, and it covers a Release created by hand, outside this
      # workflow. It also sets the `newest` output, which the gh-pages step below needs.
      # The versions come from the Releases, not from the tags: a `vX.Y.Z` tag with no Release was never published, or
      # had its Release removed on purpose; either way it can't carry the mark, and `gh release edit` couldn't act on
      # it, so it must not win here. Drafts and pre-releases are left out, and so is any Release whose tag isn't
      # exactly `vX.Y.Z`, whether or not it is flagged as a pre-release.
      # Moving the mark is cosmetic, so a failure there only warns. A lookup that still fails after three tries, or
      # finds no releases at all, fails the job, and on purpose here rather than later: `newest` is what decides below
      # whether `latest/` moves, so an empty one would next be caught by the gh-pages step's own guard — after the
      # upload to Central, the one point the job can't be re-run from. This is the first step after the checkout, so
      # a failure here comes before anything is built or uploaded, and "Re-run failed jobs" recovers it. It can't run
      # in the release-please job: a failure there would skip `publish`, and a re-run would find the Release already
      # made and report no new release, so `publish` would never fire again.
      - name: Keep the newest release marked Latest
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          : "${VERSION:?release-please reported no version}"
          # Releases come back newest-first by date, not by version, so the whole list is fetched and sorted here: the
          # default limit of 30 would drop the highest version once thirty releases were made more recently than it.
          # A lookup that fails, a 5xx or a rate limit, is tried twice more before the step gives up. gh's exit status
          # is checked on its own, apart from sed's, so a failed lookup can't be read as "no releases".
          for attempt in 1 2 3; do
            if listed=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Couldn't list the releases after ${attempt} tries. See RELEASING.md."
              exit 1
            fi
            echo "::warning::Couldn't list the releases (try ${attempt} of 3), so trying again in 10 seconds."
            sleep 10
          done
          released=$(printf '%s\n' "$listed" | sed -n 's#^v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p')
          : "${released:?no vX.Y.Z releases found}"
          # The version just released is folded in as well. release-please has already created its Release, so it is
          # normally in the list; this keeps a read that hasn't caught up from taking the mark off it.
          newest=$(printf '%s\n%s\n' "$released" "$VERSION" | sort -V | tail -n 1)
          echo "newest=${newest}" >> "$GITHUB_OUTPUT"
          if [ "$newest" != "$VERSION" ]; then
            echo "::notice::${VERSION} isn't the newest release, so v${newest} stays marked Latest."
            gh release edit "v${newest}" --repo "$GITHUB_REPOSITORY" --latest \
              || echo "::warning::Couldn't move the Latest mark to v${newest}, so it stays on ${VERSION}. See RELEASING.md."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Validates the Gradle wrapper, as it does in ci.yml, so there's no separate wrapper-validation step here.
      # The cache is read-only: a release from main would otherwise write to the same cache scope CI's runs on main
      # use, and the build below passes --no-build-cache in any case.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      # The full build runs first, without the signing key or the Portal token, so the
      # release artifacts clear Checkstyle, PMD, the coverage gate and the API check, and
      # none of the tests, checks or build logic they run can read the secrets. `check`
      # also builds the combined Javadoc site, which the Central step doesn't.
      - name: Build
        # Without the build cache, so the published jars are built from scratch (the runner is fresh, so there is
        # nothing to clean), and with a fresh API baseline. plainJavadocJar is the vanniktech plugin's task and
        # isn't part of `build`, so without it only the main and sources jars exist; the publish step uploads the
        # javadoc jars too, and the attest step below covers them. `build` also writes each published project's
        # CycloneDX SBOM, which the steps below attest and attach to the Release; Central doesn't get them.
        run: ./gradlew build plainJavadocJar --no-build-cache -PapiCheck.refresh

      # The nine jars Central receives and the three SBOMs the Release gets, twelve files, named one by one in JARS
      # and SBOMS, one path per line. The steps below all read this one list: the hash step checks that all twelve
      # exist and hashes them, and the two uploads to the GitHub Release attach exactly these. A glob would also
      # pick up files the build writes but Central never gets, such as core's test-fixtures jars, which have no
      # attestation. benchmarks and native-smoke are never published, so they're never listed.
      - name: List the published jars and SBOMs
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          : "${VERSION:?release-please reported no version}"
          cat >> "$GITHUB_ENV" <<EOF
          JARS<<LIST
          core/build/libs/unruly-engine-core-${VERSION}.jar
          core/build/libs/unruly-engine-core-${VERSION}-sources.jar
          core/build/libs/unruly-engine-core-${VERSION}-javadoc.jar
          mvel/build/libs/unruly-engine-${VERSION}.jar
          mvel/build/libs/unruly-engine-${VERSION}-sources.jar
          mvel/build/libs/unruly-engine-${VERSION}-javadoc.jar
          test-kit/build/libs/unruly-engine-test-${VERSION}.jar
          test-kit/build/libs/unruly-engine-test-${VERSION}-sources.jar
          test-kit/build/libs/unruly-engine-test-${VERSION}-javadoc.jar
          LIST
          SBOMS<<LIST
          core/build/reports/cyclonedx-direct/unruly-engine-core-${VERSION}.cdx.json
          mvel/build/reports/cyclonedx-direct/unruly-engine-${VERSION}.cdx.json
          test-kit/build/reports/cyclonedx-direct/unruly-engine-test-${VERSION}.cdx.json
          LIST
          EOF

      # sha256sum exits non-zero on a file that isn't there, so the list of subjects and the check that all twelve
      # exist are the same command: a renamed artifact, or a javadoc jar or SBOM the Build step stopped producing,
      # fails here, before anything is published. The attest step below can't do that itself — it expands
      # subject-path as a glob and only fails when nothing at all matches, so eleven files and one typo would attest
      # eleven and pass. The `sed` drops each path's directories, leaving the file name as the subject name.
      - name: Hash the published jars and SBOMs
        run: |
          : "${JARS:?the list step wrote no jars}"
          : "${SBOMS:?the list step wrote no SBOMs}"
          # Blank lines are dropped, because the runner's multiline value may or may not end in a newline, and an
          # empty path would fail sha256sum. The two upload steps below read the lists the same way.
          mapfile -t jars < <(grep . <<< "$JARS")
          mapfile -t sboms < <(grep . <<< "$SBOMS")
          # The default shell is `bash -e`, without pipefail, so a missing file would otherwise be masked by the
          # exit status of sed and tee.
          set -o pipefail
          sha256sum "${jars[@]}" "${sboms[@]}" | sed 's#  .*/#  #' | tee "${RUNNER_TEMP}/attested-files.sha256"

      # Attests those twelve digests before the jars are uploaded: a failure here costs a re-run, while a failure
      # after the upload would strand a published version, which Central won't accept a second time (the same
      # reason the gh-pages step below recreates a missing branch rather than failing). The publish step can't
      # change what was attested: its jar tasks are up to date from the Build step, and the archives are
      # reproducible either way. It doesn't run `build`, so it doesn't write the SBOMs again either.
      - name: Attest the published jars and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attested-files.sha256

      # The SBOMs go up to the Release here, before the upload to Central, and the jars only after it. An SBOM isn't
      # reproducible — each build gives it a new serial number and timestamp — and it isn't on Central, so until it
      # is attached the attested file exists only on this runner. Attached after the upload, a failure couldn't be
      # repaired: the job can't be re-run once Central has the version, and a rebuilt SBOM wouldn't match the
      # attestation. Attached here, a failure costs a re-run, like the steps above; the re-run builds and attests new
      # SBOMs, and --clobber puts them in place of any this step attached before, so the Release carries the SBOMs
      # the last attestation covers. The jars can wait: they're reproducible, and repo1 serves the same bytes.
      - name: Attach the SBOMs to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          : "${TAG:?release-please reported no tag}"
          : "${SBOMS:?the list step wrote no SBOMs}"
          mapfile -t sboms < <(grep . <<< "$SBOMS")
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${sboms[@]}"

      # Only this step gets the secrets, and it skips `check`, which the step above ran.
      # Signing is done in-memory by the vanniktech plugin — no gpg keyring is imported
      # onto the runner. All the artifacts, unruly-engine-core, unruly-engine and
      # unruly-engine-test, go up in one deployment.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
        # Without the configuration cache, which would store the signing key and Portal token on disk.
        run: ./gradlew publishAndReleaseToMavenCentral -x check --no-build-cache --no-configuration-cache

      # The nine jars the list step named, and nothing else the build wrote.
      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          : "${TAG:?release-please reported no tag}"
          : "${JARS:?the list step wrote no jars}"
          mapfile -t jars < <(grep . <<< "$JARS")
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${jars[@]}"

      # The gh-pages branch keeps one directory per release plus `latest`; the `pages` job below
      # deploys it. The Build step above generated the site, so this only copies it.
      # `latest` only moves for the newest release, so a release made out of order doesn't replace newer docs; the
      # `newest` output of the Latest step near the top of this job, read as NEWEST below, is what decides.
      # A missing branch is recreated instead of failing the job: this version is already on
      # Central, so the job can't be re-run. RELEASING.md shows how to add the older versions back.
      - name: Add the Javadoc to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
          NEWEST: ${{ steps.newest.outputs.newest }}
        run: |
          : "${VERSION:?release-please reported no version}"
          : "${NEWEST:?the Latest step reported no newest version}"
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" pages
          else
            status=$?
            # 2 means the repository has no gh-pages branch; anything else is a failed lookup.
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "::warning::The gh-pages branch was missing, so it was recreated with only the ${VERSION} Javadoc. See RELEASING.md to add the older versions back."
            git init --quiet --initial-branch gh-pages pages
            touch pages/.nojekyll
            cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>unruly-engine Javadoc</title>
          <link rel="canonical" href="latest/">
          <meta http-equiv="refresh" content="0; url=latest/">
          </head>
          <body>
          <p>The unruly-engine Javadoc has moved to <a href="latest/">latest/</a>. Docs for each release are at <code>/&lt;version&gt;/</code>.</p>
          </body>
          </html>
          EOF
          fi
          rm -rf "pages/${VERSION}"
          cp -r build/docs/javadoc "pages/${VERSION}"
          if [ "$VERSION" = "$NEWEST" ] || [ ! -d pages/latest ]; then
            rm -rf pages/latest
            cp -r build/docs/javadoc pages/latest
          else
            echo "::notice::${VERSION} isn't the newest release, so latest/ keeps the ${NEWEST} Javadoc."
          fi
          git -C pages add --all
          git -C pages -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "docs: Javadoc ${VERSION}"
          git -C pages push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      # No repo1 sync poll here: propagation can take up to 30-60 minutes (2.0.0 took about 4),
      # and waiting inside this run could hold the `release` concurrency group that long.
      # RELEASING.md shows how to confirm the sync by hand.

  # Deploys gh-pages, which `publish` just updated, to GitHub Pages. A separate job because a job has
  # one environment: `publish` uses maven-central, and a Pages deployment uses github-pages. Pushing
  # to gh-pages isn't enough on its own; see pages.yml.
  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
