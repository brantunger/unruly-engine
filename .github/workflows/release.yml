name: Release

# Two jobs, one workflow, on purpose. A tag or Release created with GITHUB_TOKEN does
# not trigger `on: push: tags` or `on: release` workflows — GitHub suppresses that to
# prevent recursion. Chaining the publish to release-please via `needs` avoids needing
# a PAT just to get the publish to fire.

on:
  push:
    # `1.x` releases hotfixes for the 1.x line once `main` moves to 2.0; see RELEASING.md.
    branches: [ "main", "1.x" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  # Never cancel: interrupting an upload leaves a half-finished deployment on the Portal.
  cancel-in-progress: false

jobs:
  release-please:
    # workflow_dispatch can be launched from any branch; without this guard
    # release-please would open a release PR against that branch.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.x'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Swap for a fine-grained PAT (contents+PRs write) if you make the CI checks
          # required on main — PRs opened by GITHUB_TOKEN do not trigger `pull_request`
          # workflows, so the release PR would otherwise sit with no checks and be unmergeable.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The branch that was pushed: release PRs, tags and the manifest are per branch.
          target-branch: ${{ github.ref_name }}

      # release-please marks every GitHub Release it creates as the repository's "Latest" release, so a hotfix
      # from 1.x would take that from a newer 2.x release. The newest version is the highest release tag, which
      # already includes the tag just created. Pre-release tags (with a suffix) are left out.
      - name: Keep the newest release marked Latest
        id: newest
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          : "${VERSION:?release-please reported no version}"
          newest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' \
            | sed -n 's#^.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -n 1)
          : "${newest:?no release tags found}"
          echo "newest=${newest}" >> "$GITHUB_OUTPUT"
          if [ "$newest" != "$VERSION" ]; then
            echo "::notice::${VERSION} isn't the newest release, so v${newest} stays marked Latest."
            gh release edit "v${newest}" --repo "$GITHUB_REPOSITORY" --latest
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Generous: the build and the synchronous Portal validation both run inside this job,
    # and a job timeout is a hard failure, so it must sit well clear of the sum of the steps.
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: write
    steps:
      # Publish exactly the commit that was tagged, never a moving main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # The full build runs first, without the signing key or the Portal token, so the
      # release artifacts clear Checkstyle, PMD, the coverage gate and the API check, and
      # none of the tests, checks or build logic they run can read the secrets. It also
      # builds the combined Javadoc site, which the Central step doesn't.
      - name: Build
        run: ./gradlew clean build javadoc --no-daemon

      # Only this step gets the secrets, and it skips `check`, which the step above ran.
      # Signing is done in-memory by the vanniktech plugin — no gpg keyring is imported
      # onto the runner. All the artifacts, unruly-engine-core, unruly-engine and
      # unruly-engine-test, go up in one deployment.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral -x check --no-daemon

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" core/build/libs/*.jar mvel/build/libs/*.jar test-kit/build/libs/*.jar --clobber

      # The gh-pages branch keeps one directory per release plus `latest`; the `pages` job below
      # deploys it. The Build step above generated the site, so this only copies it.
      # `latest` only moves for the newest release, so a hotfix from 1.x doesn't replace newer docs.
      # A missing branch is recreated instead of failing the job: this version is already on
      # Central, so the job can't be re-run. RELEASING.md shows how to add the older versions back.
      - name: Add the Javadoc to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
          NEWEST: ${{ needs.release-please.outputs.newest }}
        run: |
          : "${VERSION:?release-please reported no version}"
          : "${NEWEST:?the release-please job reported no newest version}"
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" pages
          else
            status=$?
            # 2 means the repository has no gh-pages branch; anything else is a failed lookup.
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "::warning::The gh-pages branch was missing, so it was recreated with only the ${VERSION} Javadoc. See RELEASING.md to add the older versions back."
            git init --quiet --initial-branch gh-pages pages
            touch pages/.nojekyll
            cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>unruly-engine Javadoc</title>
          <link rel="canonical" href="latest/">
          <meta http-equiv="refresh" content="0; url=latest/">
          </head>
          <body>
          <p>The unruly-engine Javadoc has moved to <a href="latest/">latest/</a>. Docs for each release are at <code>/&lt;version&gt;/</code>.</p>
          </body>
          </html>
          EOF
          fi
          rm -rf "pages/${VERSION}"
          cp -r build/docs/javadoc "pages/${VERSION}"
          if [ "$VERSION" = "$NEWEST" ] || [ ! -d pages/latest ]; then
            rm -rf pages/latest
            cp -r build/docs/javadoc pages/latest
          else
            echo "::notice::${VERSION} isn't the newest release, so latest/ keeps the ${NEWEST} Javadoc."
          fi
          git -C pages add --all
          git -C pages -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "docs: Javadoc ${VERSION}"
          git -C pages push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      # No repo1 sync poll here: propagation takes 30-60 minutes, and waiting inside this
      # run would hold the `release` concurrency group that long. RELEASING.md shows how
      # to confirm the sync by hand.

  # Deploys gh-pages, which `publish` just updated, to GitHub Pages. A separate job because a job has
  # one environment: `publish` uses maven-central, and a Pages deployment uses github-pages. Pushing
  # to gh-pages isn't enough on its own; see pages.yml.
  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
