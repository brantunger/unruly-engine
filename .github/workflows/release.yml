name: Release

# Two jobs, one workflow, on purpose. A tag or Release created with GITHUB_TOKEN does
# not trigger `on: push: tags` or `on: release` workflows — GitHub suppresses that to
# prevent recursion. Chaining the publish to release-please via `needs` avoids needing
# a PAT just to get the publish to fire.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  # Never cancel: interrupting an upload leaves a half-finished deployment on the Portal.
  cancel-in-progress: false

jobs:
  release-please:
    # workflow_dispatch can be launched from any branch; without this guard
    # release-please would open a release PR against that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Swap for a fine-grained PAT (contents+PRs write) if you make the CI checks
          # required on main — PRs opened by GITHUB_TOKEN do not trigger `pull_request`
          # workflows, so the release PR would otherwise sit with no checks and be unmergeable.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Generous: Portal validation is synchronous (3-10 min) and the sync poll below
    # runs up to 20. A job timeout is a hard failure that continue-on-error cannot
    # absorb, so it must sit well clear of the sum of the steps.
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: write
    steps:
      # Publish exactly the commit that was tagged, never a moving main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # `build` in front means the release artifact clears Checkstyle, PMD and the
      # 100% coverage gate before anything is uploaded. Signing is done in-memory by
      # the vanniktech plugin — no gpg keyring is imported onto the runner.
      - name: Build & Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew clean build publishAndReleaseToMavenCentral --no-daemon

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" build/libs/*.jar --clobber

      # publishAndReleaseToMavenCentral already blocks until the Portal finishes
      # validating, so this confirms repo1 sync only. Propagation routinely takes
      # 30-60 minutes, so it must never turn a successful release red.
      - name: Wait for Maven Central sync
        continue-on-error: true
        timeout-minutes: 20
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          URL="https://repo1.maven.org/maven2/io/github/brantunger/unruly-engine/${VERSION}/unruly-engine-${VERSION}.pom"
          for i in $(seq 1 40); do
            if curl -sSfI "$URL" >/dev/null 2>&1; then
              echo "Synced to Maven Central: $URL"
              exit 0
            fi
            echo "Attempt $i/40: not on repo1 yet, waiting 30s..."
            sleep 30
          done
          echo "Not visible on repo1 after 20 minutes. The Portal release succeeded; sync can take 30-60 minutes."
          exit 1
