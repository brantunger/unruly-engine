name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Configure GPG Settings for Signing
      id: gpg
      env:
        GPG_KEY: ${{ secrets.GPG_KEY }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        export GPG_TTY=$(tty)
        echo "$GPG_KEY" > key.asc
        gpg --batch --import key.asc
        rm key.asc
        gpg --keyserver keyserver.ubuntu.com --send-keys "$GPG_KEY_ID"
    - name: Build & Deploy
      id: deploy
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USER }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
      run: ./gradlew clean build publishAndReleaseToMavenCentral
