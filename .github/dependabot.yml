version: 2
updates:
  # `deps` is its own conventional-commit type. release-please-config.json hides it, so a
  # bump never cuts a release or appears in the changelog. Weekly bumps accumulate and ship
  # with the next feat/fix release instead of each publishing to Maven Central.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"
