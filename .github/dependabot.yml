version: 2
updates:
  # `deps` is its own conventional-commit type. release-please-config.json hides it, so a
  # bump never cuts a release or appears in the changelog. Weekly bumps accumulate and ship
  # with the next feat/fix release instead of each publishing to Maven Central.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  # buildSrc is its own Gradle build, but its dependencies, the plugins the convention plugins apply (vanniktech,
  # japicmp, gradlex, cyclonedx), now take their versions from gradle/libs.versions.toml, which the entry above
  # bumps. Delete this entry once a plugin bump arrives through the root entry, or if both entries open the same bump.
  - package-ecosystem: "gradle"
    directory: "/buildSrc"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      buildsrc-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"
