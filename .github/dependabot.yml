version: 2
updates:
  # `deps` is its own conventional-commit type. release-please-config.json hides it, so a
  # bump never cuts a release or appears in the changelog. Weekly bumps accumulate and ship
  # with the next feat/fix release instead of each publishing to Maven Central.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  # buildSrc is its own Gradle build, and the entry above may not see it: Dependabot's Gradle support has treated
  # buildSrc as an included build of the root directory, but which version github.com runs can't be checked from
  # here. Its dependencies are the plugins the convention plugins apply (vanniktech, japicmp, gradlex, cyclonedx),
  # declared in buildSrc/build.gradle by their marker coordinates rather than in the version catalog, and they appear
  # never to have been bumped. If the first weekly run opens two pull requests for the same bump, delete this entry.
  - package-ecosystem: "gradle"
    directory: "/buildSrc"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      buildsrc-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"
