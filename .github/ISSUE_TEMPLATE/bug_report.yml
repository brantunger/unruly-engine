name: 🐛 Bug report
description: Something in unruly-engine doesn't behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏

        **Found a security issue?** Please don't file it here. Follow [SECURITY.md](https://github.com/brantunger/unruly-engine/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: unruly-engine version
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: e.g. Temurin 21.0.4
    validations:
      required: true

  - type: dropdown
    id: artifacts
    attributes:
      label: Artifact(s)
      description: The jar(s) your build depends on.
      multiple: true
      options:
        - unruly-engine
        - unruly-engine-core
        - unruly-engine-test
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Expression language
      placeholder: e.g. MVEL 2.5.4, or your own
    validations:
      required: true

  - type: dropdown
    id: match-policy
    attributes:
      label: Match policy
      options:
        - firstMatch
        - allMatches
        - uniqueMatch
        - Not engine-specific
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full exception message and stack trace, if there is one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The rules (name, priority, condition, action), the facts you passed, and how you called the engine.
      render: java
    validations:
      required: true
