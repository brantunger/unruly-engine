import unruly.conventions.FilesSystemProperty

plugins {
    id 'unruly.library'
}

// Tools for testing an expression language. The engine's own tests use them too, so they can't drift from the engine.
def artifact = 'unruly-engine-test'

base {
    archivesName = artifact
}

dependencies {
    api project(':core')
    // Part of the kit's API: the contract test is a JUnit Jupiter test class.
    api libs.junit.jupiter.api

    // The toy and stub languages the kit's own tests run it against, shared with core's and mvel's tests.
    testImplementation testFixtures(project(':core'))
    testImplementation platform(libs.junit.bom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly libs.slf4j.simple
}

// The jars NamedModuleLayoutTest runs a language's contract test with, laid out as Maven's Surefire lays out a project
// whose main code is a named module: core and its dependencies, and JUnit's engine and launcher. The kit's own jar is
// passed beside them.
def namedModuleDependencies = configurations.dependencyScope('namedModuleTest')
def namedModuleTestJars = configurations.resolvable('namedModuleTestJars') {
    extendsFrom(namedModuleDependencies.get())
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
    }
}

dependencies {
    namedModuleTest project(':core')
    namedModuleTest platform(libs.junit.bom)
    namedModuleTest 'org.junit.platform:junit-platform-launcher'
    namedModuleTest 'org.junit.jupiter:junit-jupiter-engine'
    namedModuleTest libs.slf4j.simple
    // JUnit's modules require it statically, so compiling against them needs it.
    namedModuleTest libs.apiguardian.api
}

mavenPublishing {
    coordinates(project.group.toString(), artifact, project.version.toString())

    pom {
        name = artifact
        description = 'Tools for testing an Unruly expression language: a JUnit Jupiter contract test, and the ' +
                'contexts the engine passes to a language'
    }
}

apiCheck {
    artifactId = artifact
}

tasks.named('test', Test) {
    // Read by TestKitLinkageTest: the kit's compiled classes, and the list of core members they may use, which
    // core's japicmpTestKitLinkage checks.
    jvmArgumentProviders.add(objects.newInstance(FilesSystemProperty).tap {
        name = 'unruly.test-kit.classes'
        files.from(sourceSets.main.output.classesDirs)
    })
    jvmArgumentProviders.add(objects.newInstance(FilesSystemProperty).tap {
        name = 'unruly.test-kit.linkage'
        files.from(layout.settingsDirectory.file('config/japicmp/test-kit-linkage.txt'))
    })
    // Read by NamedModuleLayoutTest: the kit's jar, and the jars that core and JUnit bring.
    jvmArgumentProviders.add(objects.newInstance(FilesSystemProperty).tap {
        name = 'unruly.test-kit.jar'
        files.from(tasks.named('jar'))
    })
    jvmArgumentProviders.add(objects.newInstance(FilesSystemProperty).tap {
        name = 'unruly.test-kit.named-module-jars'
        files.from(namedModuleTestJars)
    })
}
