import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'java'
    id 'jacoco'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'checkstyle'
    id 'pmd'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
}

group = 'io.github.brantunger'
version = '1.4.0' // x-release-please-version

base {
    archivesName = 'unruly-engine'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// A stable module name for applications on the module path. Without it, the name is derived from the jar's file
// name, which changes if the jar is renamed.
tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'io.github.brantunger.unruly')
    }
}

checkstyle {
    toolVersion = '10.20.1'
    ignoreFailures = false
    maxWarnings = 0
}

pmd {
    toolVersion = '7.5.0'
    ignoreFailures = false
    sourceSets = [sourceSets.main]
    ruleSets = []
    ruleSetConfig = resources.text.fromString('''<?xml version="1.0"?>
<ruleset name="Unruly PMD Ruleset"
    xmlns="http://pmd.sourceforge.net/ruleset/2.0.0"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
    xsi:schemaLocation="http://pmd.sourceforge.net/ruleset/2.0.0 https://pmd.sourceforge.io/ruleset_2_0_0.xsd">
    <description>Unruly PMD Ruleset</description>
    <rule ref="category/java/bestpractices.xml">
        <exclude name="GuardLogStatement"/>
    </rule>
    <rule ref="category/java/errorprone.xml"/>
</ruleset>''')
}

repositories {
    mavenCentral()
}

// Publishes to the Maven Central Portal (central.sonatype.com).
// Credentials are a Portal user token supplied via the mavenCentralUsername/mavenCentralPassword
// properties; signing uses signingInMemoryKey/signingInMemoryKeyId/signingInMemoryKeyPassword.
mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
    coordinates(project.group.toString(), 'unruly-engine', project.version.toString())

    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'unruly-engine'
        description = 'Unruly is a pure Java rules engine that evaluates rules written in MVEL or a pluggable expression language'
        url = 'https://github.com/brantunger/unruly-engine'
        licenses {
            license {
                name = 'GNU GENERAL PUBLIC LICENSE v3.0'
                url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
            }
        }
        developers {
            developer {
                id = 'brantunger'
                name = 'Brant Unger'
                email = 'brant.unger@gmail.com'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/brantunger/unruly-engine.git'
            developerConnection = 'scm:git:ssh://github.com/brantunger/unruly-engine.git'
            url = 'https://github.com/brantunger/unruly-engine'
        }
    }
}

dependencies {
    implementation 'org.mvel:mvel2:2.5.4.Final'
    implementation 'org.slf4j:slf4j-api:2.0.19'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.19'
}

// Compilation always uses the Java 17 toolchain. The tests run on the JDK given by -PtestJdk (default 17), so
// CI can run them on each JDK in its matrix; otherwise the test task would use the 17 toolchain every time.
def testJdk = providers.gradleProperty('testJdk').getOrElse('17')

// The tests construct the engines directly, and those constructors are deprecated for removal (in favour of
// RulesEngineBuilder), so javac would otherwise print a removal warning for every one of them.
tasks.named('compileTestJava') {
    options.compilerArgs << '-Xlint:-removal'
}

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJdk)
    }
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
    systemProperties = [
            'junit.jupiter.extensions.autodetection.enabled': 'true',
            // Lets a test confirm it really runs on the requested JDK.
            'unruly.test.jdk': testJdk,
            // LoggingRuleListener logs at DEBUG; enabled so its messages can be asserted.
            'org.slf4j.simpleLogger.log.io.github.brantunger.unruly.api.LoggingRuleListener': 'debug',
    ]
    jacoco {
        destinationFile = layout.buildDirectory.file('jacoco/test.exec').get().asFile
    }
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/report.xml')
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 1.00
            }
            // Instruction coverage alone let an untested branch through, so branches are checked too.
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// API compatibility: every build compares the jar with the latest release on Maven Central and fails on a binary- or
// source-incompatible change to a public or protected member, so a minor or patch release can't break code compiled
// against an earlier one. Breaks intended for a major release are listed in config/japicmp/accepted-breaks.txt.
//
// The baseline is resolved in a detached configuration: in one of the project's own configurations, Gradle resolves
// the project's coordinates to the project itself, and the check would silently compare the jar with itself.
def apiBaseline = configurations.detachedConfiguration(
        dependencies.create('io.github.brantunger:unruly-engine:latest.release@jar'))
apiBaseline.transitive = false
// Looked up on every build, so a release becomes the baseline as soon as Maven Central serves it. The version in
// build.gradle can't be the baseline: on a release PR it names a version that isn't published yet.
apiBaseline.resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')

def apiBaselineVersion = apiBaseline.incoming.resolutionResult.rootComponent.map { root ->
    def dependency = root.dependencies.first()
    if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
        throw new GradleException("Can't resolve the API baseline from Maven Central", dependency.failure)
    }
    dependency.selected.moduleVersion.version
}

def acceptedBreakKinds = ['package', 'class', 'method', 'field']
// Each accepted break is [version, kind, element]. The file's header describes the format.
def acceptedBreaks = providers.fileContents(layout.projectDirectory.file('config/japicmp/accepted-breaks.txt')).asText
        .map { text ->
            def entries = []
            text.readLines().eachWithIndex { raw, i ->
                def line = raw.trim()
                if (!line || line.startsWith('#')) {
                    return
                }
                def fields = line.split(/\|/, -1)*.trim()
                if (fields.size() != 4 || fields.any { it.isEmpty() } || !(fields[1] in acceptedBreakKinds)) {
                    throw new GradleException("config/japicmp/accepted-breaks.txt:${i + 1}: expected " +
                            "'<baseline version> | package, class, method or field | <element> | <justification>', " +
                            "got: $line")
                }
                entries << [version: fields[0], kind: fields[1], element: fields[2]]
            }
            entries
        }

def japicmp = tasks.register('japicmp', me.champeau.gradle.japicmp.JapicmpTask) {
    group = 'verification'
    description = 'Checks the public API against the latest release on Maven Central.'
    oldArchives.from(apiBaseline)
    oldClasspath.from(configurations.runtimeClasspath)
    newArchives.from(tasks.named('jar'))
    newClasspath.from(configurations.runtimeClasspath)
    accessModifier = 'protected'
    onlyModified = true
    failOnModification = true
    failOnSourceIncompatibility = true

    // Only the lines for the current baseline apply; lines for another release are ignored.
    def applicable = acceptedBreaks.zip(apiBaselineVersion) { entries, version ->
        entries.findAll { it.version == version }
    }
    packageExcludes = applicable.map { entries -> entries.findAll { it.kind == 'package' }*.element }
    classExcludes = applicable.map { entries -> entries.findAll { it.kind == 'class' }*.element }
    methodExcludes = applicable.map { entries -> entries.findAll { it.kind == 'method' }*.element }
    fieldExcludes = applicable.map { entries -> entries.findAll { it.kind == 'field' }*.element }
    def ignored = acceptedBreaks.zip(apiBaselineVersion) { entries, version ->
        entries.count { it.version != version }
    }

    htmlOutputFile = layout.buildDirectory.file('reports/japicmp/report.html')
    txtOutputFile = layout.buildDirectory.file('reports/japicmp/report.txt')

    doFirst {
        if (ignored.get() > 0) {
            logger.warn("${ignored.get()} line(s) in config/japicmp/accepted-breaks.txt are for a baseline other " +
                    "than ${apiBaselineVersion.get()}, so they no longer apply. Delete them.")
        }
    }
}

check.dependsOn japicmp
