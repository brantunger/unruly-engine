import org.gradle.api.artifacts.component.ModuleComponentIdentifier

plugins {
    id 'base'
    id 'jvm-toolchains'
    id 'jacoco-report-aggregation'
}

allprojects {
    group = 'io.github.brantunger'
    version = '1.8.0' // x-release-please-version
}

// Coverage of the published artifacts. The tests are in mvel, and they cover core's and test-kit's classes too, so
// the report and the gate combine the classes of mvel, test-kit and the projects they depend on.
dependencies {
    jacocoAggregation project(':mvel')
    jacocoAggregation project(':test-kit')
}

reporting {
    reports {
        jacocoTestReport(JacocoCoverageReport) {
            testSuiteName = 'test'
            reportTask.configure {
                reports {
                    html.required = true
                    html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
                    xml.required = true
                    xml.outputLocation = layout.buildDirectory.file('reports/jacoco/report.xml')
                }
            }
        }
    }
}

def coverageVerification = tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails unless the tests cover every instruction and branch of the published artifacts.'
    def report = tasks.named('jacocoTestReport', JacocoReport).get()
    executionData.from(report.executionData)
    // The test kit's ExpressionLanguageContractTest is a test class. Its lambdas that always throw leave instructions
    // JaCoCo can't reach, and the tests run it for MVEL and for a test language, so it isn't gated.
    classDirectories.from(report.classDirectories.asFileTree.matching {
        exclude 'io/github/brantunger/unruly/test/ExpressionLanguageContractTest*'
    })
    sourceDirectories.from(report.sourceDirectories)
    violationRules {
        rule {
            limit {
                minimum = 1.00
            }
            // Instruction coverage alone let an untested branch through, so branches are checked too.
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
    }
}

tasks.named('check') {
    dependsOn coverageVerification
}

// One Javadoc site for all the modules. The javadoc tool gets the modules rather than source files, so it documents
// only the packages they export, and each module gets its own directory.
def javadocLibraryPath = configurations.create('javadocModulePath') {
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
    }
}

dependencies {
    javadocModulePath project(':mvel')
    javadocModulePath project(':test-kit')
    // JUnit's annotations refer to its API status annotation, which isn't one of JUnit's runtime dependencies.
    javadocModulePath libs.apiguardian.api
}

def moduleSources = [
        'io.github.brantunger.unruly.core': layout.projectDirectory.dir('core/src/main/java'),
        'io.github.brantunger.unruly'     : layout.projectDirectory.dir('mvel/src/main/java'),
        'io.github.brantunger.unruly.test': layout.projectDirectory.dir('test-kit/src/main/java'),
]

tasks.register('javadoc', Exec) {
    group = 'documentation'
    description = 'Generates one Javadoc site for all the modules in build/docs/javadoc.'

    // Only the libraries: the two modules themselves come from their sources.
    def libraries = javadocLibraryPath.incoming.artifactView {
        componentFilter { it instanceof ModuleComponentIdentifier }
    }.files
    def destination = layout.buildDirectory.dir('docs/javadoc')
    def title = "unruly-engine ${project.version} API"

    inputs.files(moduleSources.values()).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(libraries)
    outputs.dir(destination)

    executable = javaToolchains.javadocToolFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.get().executablePath.asFile.absolutePath
    argumentProviders.add({
        def arguments = ['-d', destination.get().asFile.absolutePath, '-quiet',
                         '-encoding', 'UTF-8', '-docencoding', 'UTF-8', '-charset', 'UTF-8',
                         '-doctitle', title, '-windowtitle', title,
                         '--module', moduleSources.keySet().join(','),
                         '--module-path', libraries.asPath]
        moduleSources.each { module, sources ->
            arguments += ['--module-source-path', "${module}=${sources.asFile.absolutePath}"]
        }
        arguments
    } as CommandLineArgumentProvider)

    doFirst {
        destination.get().asFile.deleteDir()
    }
}
