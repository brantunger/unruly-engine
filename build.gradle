import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import unruly.conventions.ModuleJavadoc

plugins {
    id 'base'
    id 'jvm-toolchains'
    id 'jacoco-report-aggregation'
}

// The same JaCoCo version as the projects' test agents, from gradle/libs.versions.toml.
jacoco {
    toolVersion = libs.versions.jacoco.get()
}

// Coverage of the published artifacts. core's tests cover core's classes, mvel's the MVEL language, and test-kit's
// and mvel's the test kit, so the report and the gate combine the execution data and the classes of all three
// projects.
dependencies {
    jacocoAggregation project(':core')
    jacocoAggregation project(':mvel')
    jacocoAggregation project(':test-kit')
}

reporting {
    reports {
        jacocoTestReport(JacocoCoverageReport) {
            testSuiteName = 'test'
            reportTask.configure {
                reports {
                    html.required = true
                    html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
                    xml.required = true
                    xml.outputLocation = layout.buildDirectory.file('reports/jacoco/report.xml')
                }
            }
        }
    }
}

def coverageReport = tasks.named('jacocoTestReport', JacocoReport)

def coverageVerification = tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails unless the tests cover every instruction and branch of the published artifacts.'
    executionData.from(coverageReport.map { report -> report.executionData })
    // JaCoCo's own tasks skip themselves when no execution data file exists, which turned this gate into a no-op
    // whenever the tests didn't run (`-x test`, or a rewired aggregation). A gate that can't measure fails instead.
    setOnlyIf('the coverage gate always runs') { true }
    doFirst { task ->
        if (!task.executionData.files.any { it.exists() }) {
            throw new GradleException('No JaCoCo execution data: the coverage gate would measure nothing. Run the ' +
                    'tests first, or skip the gate with -x jacocoTestCoverageVerification.')
        }
        // A limit is a ratio, and JaCoCo passes a NaN ratio, so no classes at all would pass the gate vacuously.
        if (task.classDirectories.asFileTree.isEmpty()) {
            throw new GradleException('No class files: the coverage gate would pass vacuously.')
        }
    }
    // The test kit's ExpressionLanguageContractTest is a test class. Its lambdas that always throw leave instructions
    // JaCoCo can't reach, and the tests run it for MVEL and for a test language, so it isn't gated.
    classDirectories.from(coverageReport.map { report ->
        report.classDirectories.asFileTree.matching {
            exclude 'io/github/brantunger/unruly/test/ExpressionLanguageContractTest*'
        }
    })
    sourceDirectories.from(coverageReport.map { report -> report.sourceDirectories })
    violationRules {
        rule {
            limit {
                minimum = 1.00
            }
            // Instruction coverage alone let an untested branch through, so branches are checked too.
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
    }
}

tasks.named('check') {
    dependsOn coverageVerification
    // The Javadoc site too, so `./gradlew build` fails on a broken doc comment, like each project's own javadoc.
    dependsOn 'javadoc'
}

// One Javadoc site for all the modules. The javadoc tool gets the modules rather than source files, so it documents
// only the packages they export, and each module gets its own directory.
def javadocLibraries = configurations.dependencyScope('javadocModulePath')
def javadocLibraryPath = configurations.resolvable('javadocModulePathJars') {
    extendsFrom(javadocLibraries.get())
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
    }
}

dependencies {
    javadocModulePath project(':mvel')
    javadocModulePath project(':test-kit')
    // JUnit's annotations refer to its API status annotation, which isn't one of JUnit's runtime dependencies.
    javadocModulePath libs.apiguardian.api
}

tasks.register('javadoc', ModuleJavadoc) {
    group = 'documentation'
    description = 'Generates one Javadoc site for all the modules in build/docs/javadoc.'
    moduleSourcePaths = [
            'io.github.brantunger.unruly.core': 'core/src/main/java',
            'io.github.brantunger.unruly'     : 'mvel/src/main/java',
            'io.github.brantunger.unruly.test': 'test-kit/src/main/java',
    ]
    // Only the libraries: the modules themselves come from their sources.
    modulePath.from(javadocLibraryPath.map { configuration ->
        configuration.incoming.artifactView { componentFilter { it instanceof ModuleComponentIdentifier } }.files
    })
    title = "unruly-engine ${project.version} API"
    // The front page: where to start, the modules, and links to the guides.
    overview = layout.projectDirectory.file('config/javadoc/overview.html')
    javadocTool = javaToolchains.javadocToolFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    destination = layout.buildDirectory.dir('docs/javadoc')
}
