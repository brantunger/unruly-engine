import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'java'
    id 'jacoco'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'checkstyle'
    id 'pmd'
}

group = 'io.github.brantunger'
version = '1.2.0' // x-release-please-version

base {
    archivesName = 'unruly-engine'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// A stable module name for applications on the module path. Without it, the name is derived from the jar's file
// name, which changes if the jar is renamed.
tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'io.github.brantunger.unruly')
    }
}

// Javadoc runs on delomboked sources. Lombok adds Rule's builder, accessors and constructors while compiling, so
// Javadoc run on the original sources leaves them out of the published documentation. Compilation, Checkstyle, PMD
// and JaCoCo still use the original sources.
def delombok = tasks.register('delombok', JavaExec) {
    def outputDir = layout.buildDirectory.dir('delombok')
    inputs.files(sourceSets.main.java)
    outputs.dir(outputDir)
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    classpath = configurations.annotationProcessor
    mainClass = 'lombok.launch.Main'
    args('delombok', 'src/main/java',
            '--target', outputDir.get().asFile.path,
            '--classpath', sourceSets.main.compileClasspath.asPath,
            '--format', 'generated:skip',
            '--format', 'javaLangAsFQN:skip')
}

tasks.named('javadoc') {
    dependsOn delombok
    source = layout.buildDirectory.dir('delombok')
}

checkstyle {
    toolVersion = '10.20.1'
    ignoreFailures = false
    maxWarnings = 0
}

pmd {
    toolVersion = '7.5.0'
    ignoreFailures = false
    sourceSets = [sourceSets.main]
    ruleSets = []
    ruleSetConfig = resources.text.fromString('''<?xml version="1.0"?>
<ruleset name="Unruly PMD Ruleset"
    xmlns="http://pmd.sourceforge.net/ruleset/2.0.0"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
    xsi:schemaLocation="http://pmd.sourceforge.net/ruleset/2.0.0 https://pmd.sourceforge.io/ruleset_2_0_0.xsd">
    <description>Unruly PMD Ruleset</description>
    <rule ref="category/java/bestpractices.xml">
        <exclude name="GuardLogStatement"/>
    </rule>
    <rule ref="category/java/errorprone.xml"/>
</ruleset>''')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Publishes to the Maven Central Portal (central.sonatype.com).
// Credentials are a Portal user token supplied via the mavenCentralUsername/mavenCentralPassword
// properties; signing uses signingInMemoryKey/signingInMemoryKeyId/signingInMemoryKeyPassword.
mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
    coordinates(project.group.toString(), 'unruly-engine', project.version.toString())

    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'unruly-engine'
        description = 'Unruly is a pure Java rules engine that evaluates rules written in MVEL or a pluggable expression language'
        url = 'https://github.com/brantunger/unruly-engine'
        licenses {
            license {
                name = 'GNU GENERAL PUBLIC LICENSE v3.0'
                url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
            }
        }
        developers {
            developer {
                id = 'brantunger'
                name = 'Brant Unger'
                email = 'brant.unger@gmail.com'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/brantunger/unruly-engine.git'
            developerConnection = 'scm:git:ssh://github.com/brantunger/unruly-engine.git'
            url = 'https://github.com/brantunger/unruly-engine'
        }
    }
}

dependencies {
    implementation 'org.mvel:mvel2:2.5.4.Final'
    implementation 'org.slf4j:slf4j-api:2.0.19'

    compileOnly 'org.projectlombok:lombok:1.18.48'

    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.19'
}

// Compilation always uses the Java 17 toolchain. The tests run on the JDK given by -PtestJdk (default 17), so
// CI can run them on each JDK in its matrix; otherwise the test task would use the 17 toolchain every time.
def testJdk = providers.gradleProperty('testJdk').getOrElse('17')

test {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJdk)
    }
    useJUnitPlatform {
        includeEngines 'junit-jupiter'
    }
    systemProperties = [
            'junit.jupiter.extensions.autodetection.enabled': 'true',
            // Lets a test confirm it really runs on the requested JDK.
            'unruly.test.jdk': testJdk,
            // LoggingRuleListener logs at DEBUG; enabled so its messages can be asserted.
            'org.slf4j.simpleLogger.log.io.github.brantunger.unruly.api.LoggingRuleListener': 'debug',
    ]
    jacoco {
        destinationFile = layout.buildDirectory.file('jacoco/test.exec').get().asFile
    }
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/report.xml')
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 1.00
            }
            // Instruction coverage alone let an untested branch through, so branches are checked too.
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
