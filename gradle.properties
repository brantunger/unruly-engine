# Reuse task outputs from earlier builds, including other branches' (the build cache), and the configured task graph
# when nothing that affects it has changed (the configuration cache). The release workflow builds without the build
# cache, so published artifacts are built from scratch.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# An IDE sync builds its models in parallel too, as org.gradle.parallel does for tasks. Gradle deprecates leaving this
# to follow org.gradle.parallel by default, and org.gradle.warning.mode=fail below would fail the sync on that.
org.gradle.tooling.parallel=true

# The build compiles with the Java 21 toolchain it finds installed: a missing JDK fails the build, naming the version
# it needs. No download repository is configured (settings.gradle.kts applies no toolchain resolver), and this keeps a
# missing JDK from being fetched silently even if one is added.
org.gradle.java.installations.auto-download=false

# A Gradle deprecation fails the build that hits it, so the next Gradle major doesn't arrive as a surprise. CI and the
# release configure every build, so a deprecation fails them all. Locally, one in a build script fails the first
# build, which stores its configuration cache entry anyway; a rerun of the same tasks reuses the entry and passes. Run
# with --no-configuration-cache before deciding a deprecation is gone; see docs/contributing/build-and-gates.md.
org.gradle.warning.mode=fail

# The coordinates of every project. release-please bumps the version between the markers on each release.
# -Pversion=... overrides it for compiling and packaging; the API check needs a real version to find its baseline.
group=io.github.brantunger
# x-release-please-start-version
version=2.35.4
# x-release-please-end
