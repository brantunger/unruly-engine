# Reuse task outputs from earlier builds, including other branches' (the build cache), and the configured task graph
# when nothing that affects it has changed (the configuration cache). The release workflow builds without the build
# cache, so published artifacts are built from scratch.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# The coordinates of every project. release-please bumps the version between the markers on each release.
# -Pversion=... overrides it for compiling and packaging; the API check needs a real version to find its baseline.
group=io.github.brantunger
# x-release-please-start-version
version=1.8.0
# x-release-please-end
